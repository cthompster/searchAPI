# Backstop for a test that hangs: fail any test or lifecycle method after 5 minutes. Requests also
# have their own 30 s connect/read timeout (ITunesApi, -DhttpTimeoutMs). A separate thread lets the
# timeout fire even while a request is blocked. 5 minutes leaves room for a two-request test to hit
# the HTTP timeout first, even with -DhttpTimeoutMs=60000.
junit.jupiter.execution.timeout.default = 5 m
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
